{% extends "base.html" %}
{% block title %}Prise de Rendez-vous - MediSecure{% endblock %}
{% block content %}
<div class="row mb-4">
  <div class="col-12 text-center">
    <h1 class="display-6 fw-bold">Prendre un Rendez-vous</h1>
    <p class="text-muted">Trouvez le spécialiste qui vous correspond.</p>
  </div>
</div>

<div class="row justify-content-center mb-5">
  <div class="col-lg-8">
    <div class="ms-card">
      <form class="row g-3" hx-get="{% url 'portal:doctor-search' %}" hx-target="#doctor-results" hx-trigger="change, keyup delay:500ms from:input" hx-indicator=".loader">
        <div class="col-md-5">
          <label class="form-label text-muted small fw-bold">Spécialité</label>
          <select name="specialite" class="form-select border-0 bg-light-subtle py-3 px-4" style="border-radius: 10px;">
            <option value="">Toutes les spécialités</option>
            {% for spec in specialites %}
            <option value="{{ spec.id }}">{{ spec.nom_specialite }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-7">
          <label class="form-label text-muted small fw-bold">Nom du médecin</label>
          <div class="input-group border-0 bg-light-subtle rounded px-2" style="border-radius: 10px !important;">
            <span class="input-group-text border-0 bg-transparent py-3">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" name="q" class="form-control border-0 bg-transparent shadow-none" placeholder="Rechercher un nom...">
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-lg-10">
    <div class="text-center loader htmx-indicator mb-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
    </div>

    <div
      id="doctor-results"
      class="row g-4"
      hx-get="{% url 'portal:doctor-search' %}"
      hx-trigger="load"
    >
      <!-- HTMX injects results here -->
    </div>
  </div>
</div>
{% endblock %}
