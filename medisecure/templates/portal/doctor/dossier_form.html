{% extends "base.html" %} {% load crispy_forms_tags %} {% block title %}Édition
Dossier - {{ patient.user.nom }}{% endblock %} {% block content %}
<div class="row justify-content-center mb-5">
  <div class="col-lg-8">
    <div class="ms-card p-0 overflow-hidden">
      <div class="card-header bg-transparent border-0 px-4 py-4">
        <div class="d-flex align-items-center">
          <a href="{% url 'portal:doctor-patients' %}" class="ms-btn ms-btn-secondary p-2 me-3" style="width: 40px; height: 40px; justify-content: center; border-radius: 50%;">
            <i class="bi bi-arrow-left"></i>
          </a>
          <h5 class="mb-0 fw-bold">
            Dossier de {{ patient.user.prenom }} {{ patient.user.nom }}
          </h5>
        </div>
      </div>
      <div class="card-body px-4 pb-4">
        <form method="post" class="needs-validation">
          {% csrf_token %} 
          <div class="mb-3">
            {{ form|crispy }}
          </div>
          <div class="text-end mt-4">
            <button type="submit" class="ms-btn ms-btn-primary px-5 py-3">
              Sauvegarder les modifications
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
